<!-- src/app/shop/components/order-detail.component.html -->
<ng-container *ngIf="order; else loadingTpl">
    <h2 class="text-2xl font-bold mb-4">Order #{{ order.id }}</h2>
  
    <mat-card class="mb-4">
      <mat-card-title>Status: {{ order.status }}</mat-card-title>
      <mat-card-content>
        <p>Date: {{ order.orderDate | date : 'medium' }}</p>
        <p>Total: {{ order.totalAmount | currency }}</p>
        <p>User: {{ order.user.email }}</p>
      </mat-card-content>
      <mat-card-actions *ngIf="order.status === 'DELIVERED'">
        <button mat-raised-button color="warn" (click)="requestRefund()">
          Request refund
        </button>
      </mat-card-actions>
    </mat-card>
  
    <h3 class="text-xl font-semibold mb-2">Items</h3>
    <table mat-table [dataSource]="order.items" class="w-full">
      <ng-container matColumnDef="product">
        <th mat-header-cell *matHeaderCellDef>Product</th>
        <td mat-cell *matCellDef="let i">{{ i.product.name }}</td>
      </ng-container>
      <ng-container matColumnDef="qty">
        <th mat-header-cell *matHeaderCellDef>Qty</th>
        <td mat-cell *matCellDef="let i">{{ i.quantity }}</td>
      </ng-container>
      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let i">{{ i.price | currency }}</td>
      </ng-container>
  
      <tr mat-header-row *matHeaderRowDef="['product','qty','price']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['product','qty','price']"></tr>
    </table>
  </ng-container>
  
  <ng-template #loadingTpl>
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </ng-template>
