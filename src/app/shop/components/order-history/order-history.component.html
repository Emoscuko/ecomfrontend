<!-- src/app/shop/components/order-history.component.html -->
<div class="p-4">
  <h2 class="text-2xl font-bold mb-4">Order History</h2>

  <div *ngIf="!loading; else loadingTpl">
    <div *ngFor="let order of orders" class="border border-gray-300 rounded mb-4 p-3">
      <div class="flex justify-between">
        <div>
          <p><strong>Order #:</strong> {{ order.id }}</p>
          <p><strong>Date:</strong> {{ order.orderDate | date:'medium' }}</p>
          <p><strong>Status:</strong> {{ order.status }}</p>
        </div>
        <div class="text-right">
          <p class="font-semibold">Total: {{ order.totalAmount | currency }}</p>
        </div>
      </div>

      <!-- action buttons -->
      <div class="mt-2 flex space-x-2">
        <button mat-button color="primary" (click)="viewDetail(order.id)">
          View Details
        </button>
        <button
          mat-button
          color="warn"
          *ngIf="order.status === 'DELIVERED'"
          (click)="requestRefund(order)"
        >
          Request Refund
        </button>
      </div>

      <!-- expand items -->
      <div class="mt-2">
        <button mat-button (click)="toggle(order.id)">
          {{ isExpanded(order.id) ? 'Hide Items' : 'View Items' }}
        </button>
        <ul *ngIf="isExpanded(order.id)" class="list-disc list-inside ml-4">
          <li *ngFor="let item of order.items">
            {{ item.product.name }} (x{{ item.quantity }})
            {{ (item.price * item.quantity) | currency }}
          </li>
        </ul>
      </div>
    </div>

    <p *ngIf="orders.length === 0" class="text-gray-600">
      You have no past orders.
    </p>
  </div>

  <ng-template #loadingTpl>
    <div class="text-center py-6">
      <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
      <p>Loading orders...</p>
    </div>
  </ng-template>
</div>
