<!-- src/app/shop/components/product-list.component.html -->
<div class="p-4">
    <h2 class="text-3xl font-bold mb-4">Products</h2>
    <!-- Search and Filter Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-4 space-y-2 sm:space-y-0">
      <div>
        <input [(ngModel)]="searchTerm" (ngModelChange)="onSearch($event)"
               type="text" placeholder="Search products..." 
               class="border px-3 py-1 rounded w-full sm:w-64" />
      </div>
      <div>
        <select [(ngModel)]="selectedCategory" (ngModelChange)="onCategoryChange($event)"
                class="border px-3 py-1 rounded">
          <option value="all">All Categories</option>
          <option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</option>
        </select>
      </div>
    </div>
  
    <!-- Product Grid -->
    <div *ngIf="!loading; else loadingTpl" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <mat-card *ngFor="let product of filteredProducts" class="hover:shadow-lg">
        <mat-card-header>
          <mat-card-title>{{ product.name }}</mat-card-title>
        </mat-card-header>
        <img mat-card-image [src]="product.imageUrl" alt="{{ product.name }}" class="object-cover h-48 w-full">
        <mat-card-content>
          <p class="text-gray-700">{{ product.description | slice:0:80 }}...</p>
          <p class="mt-2 font-semibold">Price: {{ product.price | currency }}</p>
        </mat-card-content>
        <mat-card-actions>
          <a mat-button color="primary" [routerLink]="'/product/' + product.id">View Details</a>
          <button mat-button color="accent" (click)="addToCart(product)">
            Add to Cart
          </button>
        </mat-card-actions>

          <button mat-button (click)="addToCompare(product)">Compare</button>

      </mat-card>
    </div>
  
    <!-- Loading spinner template -->
    <ng-template #loadingTpl>
      <div class="text-center py-10">
        <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
      </div>
    </ng-template>
  </div>
