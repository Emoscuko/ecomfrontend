<!-- src/app/shop/components/cart.component.html -->
<div class="p-4 max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold mb-4">Shopping Cart</h2>
    <div *ngIf="cartItems.length; else emptyCart">
      <table class="w-full border-t border-b border-gray-300 mb-4">
        <tr class="text-left font-semibold bg-gray-100">
          <th class="p-2">Product</th>
          <th class="p-2">Price</th>
          <th class="p-2">Quantity</th>
          <th class="p-2">Total</th>
          <th class="p-2"></th>
        </tr>
        <tr *ngFor="let item of cartItems" class="border-b">
          <td class="p-2">{{ item.product.name }}</td>
          <td class="p-2">{{ item.product.price | currency }}</td>
          <td class="p-2">
            <input type="number"
       [ngModel]="item.quantity"
       (ngModelChange)="updateQuantity(item, $event)"
       min="1"
       [max]="item.product.stock"
       class="w-16 border rounded text-center" />

          </td>
          <td class="p-2">{{ (item.product.price * item.quantity) | currency }}</td>
          <td class="p-2 text-right">
            <button mat-button color="warn" (click)="removeItem(item)">Remove</button>
          </td>
        </tr>
      </table>
      <div class="text-right mb-4 text-xl">
        <strong>Total: {{ total | currency }}</strong>
      </div>
      <div class="text-right">
        <button mat-raised-button color="primary" (click)="checkout()">Proceed to Checkout</button>
      </div>
    </div>
    <ng-template #emptyCart>
      <p>Your cart is empty. <a routerLink="/" class="text-blue-600 underline">Continue shopping</a>.</p>
    </ng-template>
  </div>
