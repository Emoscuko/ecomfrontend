<!-- src/app/auth/components/register.component.html (simplified structure) -->
<div class="max-w-sm mx-auto mt-10 p-4 border rounded shadow">
    <h2 class="text-2xl font-semibold mb-4 text-center">Register</h2>
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Name field -->
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required>
        <mat-error *ngIf="registerForm.get('name')?.invalid">Name is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="example@domain.com" required>
        <mat-error *ngIf="registerForm.get('email')?.invalid">Valid email is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-6">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" required>
        <mat-error *ngIf="registerForm.get('password')?.invalid">Password is required</mat-error>
      </mat-form-field>

      <!-- Submit button and error/success messages -->
      <button mat-raised-button color="primary" class="w-full" type="submit" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>
      <div *ngIf="error" class="text-red-500 mt-2 text-center">{{ error }}</div>
      <div *ngIf="successMessage" class="text-green-600 mt-2 text-center">{{ successMessage }}</div>
      <p class="mt-4 text-center text-sm">
        Already have an account?
        <a routerLink="/auth/login" class="text-blue-600 hover:underline">Login here</a>.
      </p>
    </form>
  </div>
