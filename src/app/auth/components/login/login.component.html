<!-- src/app/auth/components/login.component.html -->
<div class="max-w-sm mx-auto mt-10 p-4 border border-gray-300 rounded shadow">
    <h2 class="text-2xl font-semibold mb-4 text-center">Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="email" placeholder="example@domain.com" required>
        <mat-error *ngIf="loginForm.get('email')?.invalid">Valid email is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="outline" class="w-full mb-6">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" required>
        <mat-error *ngIf="loginForm.get('password')?.invalid">Password is required</mat-error>
      </mat-form-field>
      <button mat-raised-button color="primary" class="w-full" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Login' }}
      </button>
      <div *ngIf="errorMessage" class="text-red-500 mt-2 text-center">{{ errorMessage }}</div>
      <p class="mt-4 text-center text-sm">
        Don't have an account?
        <a routerLink="/auth/register" class="text-blue-600 hover:underline">Register here</a>.
      </p>
    </form>
  </div>
