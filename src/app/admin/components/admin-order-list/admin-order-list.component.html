<!-- src/app/admin/components/admin-order-list.component.html -->
<h2 class="text-xl font-bold mb-4">Orders</h2>
<table class="min-w-full border">
  <tr class="bg-gray-100">
    <th class="p-2">Order #</th>
    <th class="p-2">User</th>
    <th class="p-2">Date</th>
    <th class="p-2">Total</th>
    <th class="p-2">Status</th>
  </tr>
  <tr *ngFor="let order of orders" class="border-t text-sm">
    <td class="p-2">{{ order.id }}</td>
    <td class="p-2">{{ order.user.email }}</td>
    <td class="p-2">{{ order.orderDate | date:'short' }}</td>
    <td class="p-2">{{ order.totalAmount | currency }}</td>
    <td class="p-2">
      <select [ngModel]="order.status" (ngModelChange)="updateStatus(order, $event)" class="border rounded px-1">
        <option *ngFor="let status of statusOptions" [value]="status">{{ status }}</option>
      </select>
    </td>
  </tr>
</table>
<div *ngIf="loading" class="text-center my-4">
  <mat-progress-spinner mode="indeterminate" diameter="30"></mat-progress-spinner>
</div>
