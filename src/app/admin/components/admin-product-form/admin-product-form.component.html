<!-- src/app/admin/components/admin-product-form.component.html -->
<div class="max-w-md">
    <h2 class="text-xl font-bold mb-4">{{ isEditMode ? 'Edit Product' : 'Add Product' }}</h2>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <mat-form-field class="w-full mb-3">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" required>
        <mat-error *ngIf="productForm.get('name')?.hasError('required')">Name is required</mat-error>
      </mat-form-field>
      <mat-form-field class="w-full mb-3">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="description" rows="3"></textarea>
      </mat-form-field>
      <mat-form-field class="w-full mb-3">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" required>
        <mat-error *ngIf="productForm.get('price')?.hasError('required')">Price is required</mat-error>
      </mat-form-field>
      <mat-form-field class="w-full mb-3">
        <mat-label>SellerID</mat-label>
        <input matInput type="number" formControlName="sellerId">
        </mat-form-field>
      <mat-form-field class="w-full mb-3">
        <mat-label>Stock</mat-label>
        <input matInput type="number" formControlName="stock" required>
        <mat-error *ngIf="productForm.get('stock')?.hasError('required')">
          Stock is required
        </mat-error>
      </mat-form-field>
      
      <mat-form-field class="w-full mb-3">
        <mat-label>Category</mat-label>
        <mat-select formControlName="categoryId" required>
          <mat-option *ngFor="let cat of categories" [value]="cat.id">{{ cat.name }}</mat-option>
        </mat-select>
        <mat-error *ngIf="productForm.get('categoryId')?.hasError('required')">Category is required</mat-error>
      </mat-form-field>
      <mat-form-field class="w-full mb-3">
        <mat-label>Image URL</mat-label>
        <input matInput formControlName="imageUrl">
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit" [disabled]="loading">
        {{ loading ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update Product' : 'Create Product') }}
      </button>
      <button mat-button type="button" (click)="navigateToProducts()">Cancel</button>
    </form>
  </div>
