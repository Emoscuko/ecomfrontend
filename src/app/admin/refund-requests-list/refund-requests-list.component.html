<h2 class="text-2xl font-bold mb-4">Refund requests</h2>

<table mat-table [dataSource]="data" class="w-full" *ngIf="!loading; else loadTpl">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>#</th>
    <td mat-cell *matCellDef="let r">{{ r.id }}</td>
  </ng-container>

  <ng-container matColumnDef="order">
    <th mat-header-cell *matHeaderCellDef>Order</th>
    <td mat-cell *matCellDef="let r">{{ r.orderId }}</td>
  </ng-container>

  <ng-container matColumnDef="user">
    <th mat-header-cell *matHeaderCellDef>User</th>
    <td mat-cell *matCellDef="let r">{{ r.userId }}</td>
  </ng-container>

  <ng-container matColumnDef="reason">
    <th mat-header-cell *matHeaderCellDef>Reason</th>
    <td mat-cell *matCellDef="let r">{{ r.reason }}</td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let r">{{ r.status }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let r">
      <button mat-button color="primary" (click)="decide(r,true)" *ngIf="r.status==='PENDING'">
        Accept
      </button>
      <button mat-button color="warn" (click)="decide(r,false)" *ngIf="r.status==='PENDING'">
        Reject
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<ng-template #loadTpl>
  <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
</ng-template>
